<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nasaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1144"/>
      <stop offset="100%" stop-color="#070418"/>
    </linearGradient>
    <radialGradient id="nasaGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#nasaGrad)"/>
  <rect width="400" height="300" fill="url(#nasaGlow)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40"  r="1.2" opacity="0.8"/>
    <circle cx="340" cy="60" r="1.5" opacity="0.7"/>
    <circle cx="80" cy="240" r="1.0" opacity="0.5"/>
    <circle cx="350" cy="220" r="1.4" opacity="0.6"/>
    <circle cx="290" cy="40"  r="1.0" opacity="0.4"/>
    <circle cx="50" cy="160"  r="1.0" opacity="0.4"/>
  </g>

  <!-- Orbit -->
  <ellipse cx="200" cy="110" rx="48" ry="20" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.85"/>
  <circle cx="200" cy="110" r="14" fill="#a78bfa"/>
  <text x="200" y="115" text-anchor="middle" fill="#070418"
        font-family="ui-monospace" font-size="11" font-weight="700"
        letter-spacing="1">★</text>

  <text x="200" y="190" text-anchor="middle" fill="#ffffff"
        font-family="ui-sans-serif, system-ui" font-size="22" font-weight="700"
        letter-spacing="0.5">NASA Space Apps</text>

  <text x="200" y="220" text-anchor="middle" fill="rgba(255,255,255,0.65)"
        font-family="ui-monospace" font-size="11" letter-spacing="2">GLOBAL NOMINEE</text>

  <text x="200" y="260" text-anchor="middle" fill="#a78bfa"
        font-family="ui-monospace" font-size="13" letter-spacing="3" opacity="0.85">2019</text>
</svg>
