<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a0c1c"/>
      <stop offset="100%" stop-color="#2a0a0f"/>
    </linearGradient>
    <radialGradient id="mitGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#mitGrad)"/>
  <rect width="400" height="300" fill="url(#mitGlow)"/>

  <!-- Decorative ring -->
  <circle cx="200" cy="110" r="38" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.85"/>
  <circle cx="200" cy="110" r="28" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
  <text x="200" y="118" text-anchor="middle" fill="#fbbf24"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas" font-size="18" font-weight="700"
        letter-spacing="2">1st</text>

  <text x="200" y="190" text-anchor="middle" fill="#ffffff"
        font-family="ui-sans-serif, system-ui, -apple-system" font-size="22" font-weight="700"
        letter-spacing="0.5">MIT Reality Hack</text>

  <text x="200" y="220" text-anchor="middle" fill="rgba(255,255,255,0.65)"
        font-family="ui-monospace" font-size="11" letter-spacing="2">HEALTHCARE · STARTUP TRACK</text>

  <text x="200" y="260" text-anchor="middle" fill="#fbbf24"
        font-family="ui-monospace" font-size="13" letter-spacing="3" opacity="0.85">2024</text>
</svg>
